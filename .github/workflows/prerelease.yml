name: prerelease

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate + build
        run: |
          node scripts/validate-userscripts.mjs
          node scripts/build-catalog.mjs

      - name: Package userscripts bundle
        run: |
          mkdir -p out
          zip -j out/userscripts-all.zip scripts/*/*.user.js
          (cd dist && zip -r ../out/catalog-site.zip .)

      - name: Compute tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=prerelease-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            out/userscripts-all.zip
            out/catalog-site.zip
            scripts/*/*.user.js
